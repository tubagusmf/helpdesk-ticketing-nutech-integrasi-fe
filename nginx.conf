server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow ticket attachments
    client_max_body_size 30M;

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
}